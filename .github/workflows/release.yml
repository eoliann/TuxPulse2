name: Validate and release Linux packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          rustup update stable
          rustup default stable
      - run: npm ci
      - run: npm run version:check && npm run lint && npm test
      - run: npm run build
      - name: Validate shell scripts
        run: bash -n build_all.sh build_deb.sh scripts/build_arch_package.sh
      - name: Rust regression tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --release --locked
      - name: Build Debian and RPM packages
        run: npm run tauri build -- --bundles deb,rpm
      - name: Inspect package contents
        run: |
          for package in src-tauri/target/release/bundle/deb/*.deb; do
            dpkg-deb --contents "$package" > /tmp/package-contents.txt
            if grep -E 'tuxpulse.helper|com.eoliann.tuxpulse.policy' /tmp/package-contents.txt; then exit 1; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed base-devel git nodejs npm rust webkit2gtk-4.1 gtk3 libayatana-appindicator librsvg openssl pkgconf file
      - uses: actions/checkout@v5
      - run: npm ci && npm run build
      - run: cargo build --manifest-path src-tauri/Cargo.toml --release --locked
      - name: Build Arch package without root
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE' && bash scripts/build_arch_package.sh"
          for package in release/packages/arch/*.pkg.tar.zst; do
            if tar -tf "$package" | grep -E 'tuxpulse.helper|com.eoliann.tuxpulse.policy'; then exit 1; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: release/packages/arch/*.pkg.tar.zst
          if-no-files-found: error

  uninstall:
    name: Install and remove on ${{ matrix.distro }}
    needs: [linux, arch]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Debian
            image: debian:12
            artifact: linux-packages
            desktop: TuxPulse.desktop
          - distro: Fedora
            image: fedora:latest
            artifact: linux-packages
            desktop: TuxPulse.desktop
          - distro: Arch
            image: archlinux:latest
            artifact: arch-package
            desktop: tuxpulse.desktop
    container: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: packages
      - name: Check the installed package and its removal
        env:
          DISTRO: ${{ matrix.distro }}
          DESKTOP_ID: ${{ matrix.desktop }}
        run: |
          case "$DISTRO" in
            Debian)
              apt-get update
              apt-get install -y ./packages/deb/*.deb
              remove=(apt-get remove -y tux-pulse)
              ;;
            Fedora)
              dnf install -y ./packages/rpm/*.rpm
              remove=(dnf remove -y tux-pulse)
              ;;
            Arch)
              pacman -Syu --noconfirm
              pacman -U --noconfirm ./packages/*.pkg.tar.zst
              remove=(pacman -R --noconfirm tuxpulse)
              ;;
          esac
          binary=/usr/bin/tuxpulse
          launcher="/usr/share/applications/$DESKTOP_ID"
          metadata=/usr/share/metainfo/com.eoliann.tuxpulse.metainfo.xml
          test -x "$binary"
          test -f "$launcher"
          grep -F "<launchable type=\"desktop-id\">$DESKTOP_ID</launchable>" "$metadata"
          "${remove[@]}"
          test ! -e "$binary"
          test ! -e "$launcher"
          test ! -e "$metadata"

  publish:
    needs: [linux, arch, uninstall]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: packages
      - name: Publish release after all builds and tests pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; no changes made."
            exit 0
          fi
          find packages -type f -print0 | sort -z | while IFS= read -r -d '' asset; do
            (cd "$(dirname "$asset")" && sha256sum "$(basename "$asset")")
          done > SHA256SUMS
          mapfile -t assets < <(find packages -type f)
          gh release create "$tag" "${assets[@]}" SHA256SUMS --target "$GITHUB_SHA" --title "$tag" --notes-file RELEASE_NOTES.md --latest

